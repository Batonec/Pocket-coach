name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: miniapp-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ios: ${{ steps.filter.outputs.ios }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            changed_files="$(git diff --name-only "origin/$BASE_REF...$HEAD_SHA")"
          elif [ -n "${BEFORE_SHA:-}" ] \
            && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            # After a force-push `before` may be an unreachable commit — fall
            # through to diff-tree instead of failing the whole run.
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
          else
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")"
          fi

          echo "Changed files:"
          printf '%s\n' "$changed_files"

          has_match() {
            pattern="$1"
            if printf '%s\n' "$changed_files" | grep -Eq "$pattern"; then
              echo "true"
            else
              echo "false"
            fi
          }

          echo "backend=$(has_match '^(backend/server\.py$|backend/backend_store\.py$|backend/recommender\.py$|backend/prompt_builder\.py$|backend/plan_validator\.py$|backend/anthropic_client\.py$|backend/coach_state\.py$|backend/coach_features\.py$|backend/coach_signals\.py$|backend/coach_prompts\.py$|backend/prompts/.*\.md$|backend/copy/.*\.md$|backend/refresh_recommendation\.py$|backend/weekly_report\.py$|backend/backup_db\.py$|coach_mcp/server\.py$|backend/deploy/trainer-miniapp-backend\.service$|\.github/workflows/deploy-backend\.yml$)')" >> "$GITHUB_OUTPUT"

          # Каталог целиком: в iOS нет списка модулей, который можно забыть
          # обновить, — любой .swift, ресурс или сам проект требуют пересборки.
          echo "ios=$(has_match '^(ios/.*|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    # Не под `needs: changes`: джоба дешёвая (ubuntu, меньше минуты) и проверяет
    # в том числе сами воркфлоу — гейт, который сам себя не линтует, бесполезен.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Версия закреплена намеренно: свежий ruff умеет находить новые
      # замечания, и обновление должно быть отдельным коммитом, а не
      # сюрпризом на чужом PR. Поднимать вместе со строкой в ruff.toml.
      - name: Install ruff
        run: pip install ruff==0.16.3

      - name: Lint Python
        run: ruff check --output-format github .

      - name: Check Python formatting
        run: ruff format --check --diff .

      # shellcheck предустановлен на ubuntu-раннерах, actionlint — нет.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -eu
          url="https://github.com/rhysd/actionlint/releases/download"
          url="$url/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "$url" | tar -xz -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/actionlint" --version

      - name: Lint shell scripts
        run: shellcheck backend/deploy/deploy.sh .claude/hooks/claude-md-reminder.sh

      # actionlint сам прогоняет shellcheck по инлайновым `run:`.
      - name: Lint GitHub Actions workflows
        run: actionlint

  test:
    name: Run test suite
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run automated tests
        run: python -m unittest discover -s backend/tests -p "test_*.py" -v

  ios:
    name: Run iOS tests
    needs: changes
    # macOS-раннеры дороже линуксовых на порядок, поэтому только когда правда
    # тронут iOS. Для публичного репозитория минуты бесплатны, но очередь на
    # macOS длиннее — гонять их на каждый бэкендовый коммит незачем.
    if: needs.changes.outputs.ios == 'true'
    # macos-26 нужен ради Xcode 26: Views.swift использует glassEffect (Liquid
    # Glass), которого нет в SDK Xcode 16 с образа macos-15 — там сборка падает
    # на компиляции, а не на тестах.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select the newest Xcode
        run: |
          set -eu
          newest="$(printf '%s\n' /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Xcode: $newest"
          sudo xcode-select -s "$newest"
          xcodebuild -version

      # swift-format идёт в тулчейне Xcode — ставить нечего. Стоит секунды, и
      # выполняется ДО тестов: незачем занимать дорогой macOS-раннер на 15
      # минут, если человек просто забыл прогнать форматтер. --strict делает
      # ошибкой и расхождение с форматтером, а не только нарушение правил.
      - name: Lint Swift
        run: |
          set -eu
          git ls-files -z '*.swift' | xargs -0 xcrun swift-format lint --strict --parallel

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          set -eu
          # Берём UDID, а не имя: имена вроде «iPhone SE (3rd generation)» ломают
          # любой разбор скобок, а образы раннера меняют состав устройств —
          # захардкоженное имя отвалилось бы молча в день замены.
          cat > /tmp/pick_simulator.py <<'PYEOF'
          import json
          import subprocess
          import sys

          raw = subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"]
          )
          best = None
          for runtime, devices in json.loads(raw)["devices"].items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if not device["name"].startswith("iPhone"):
                      continue
                  key = (runtime, device["name"])
                  if best is None or key > best[0]:
                      best = (key, device["udid"], device["name"])
          if best is None:
              sys.exit("на раннере нет ни одного доступного симулятора iPhone")
          print(f"{best[1]}\t{best[2]}")
          PYEOF
          picked="$(python3 /tmp/pick_simulator.py)"
          udid="${picked%%$'\t'*}"
          name="${picked#*$'\t'}"
          echo "Симулятор: $name ($udid)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run iOS tests
        working-directory: ios
        run: |
          set -eu
          xcodebuild \
            -project TrainerIOS.xcodeproj \
            -scheme TrainerIOS \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            test

  deploy-backend:
    name: Deploy backend after tests
    needs:
      - changes
      - lint
      - test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/deploy-backend.yml
    secrets: inherit
